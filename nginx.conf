server {
  listen 80;
  server_name _; # Accepte tout nom de domaine (géré par Traefik en amont)

  # Ne pas annoncer la version de nginx
  server_tokens off;

  # Aucun journal d'accès : le site ne conserve ni adresse IP ni pages
  # consultées (cf. politique de confidentialité). Les erreurs restent
  # journalisées sur stderr.
  access_log off;

  # Compression GZIP (Indispensable en production)
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied expired no-cache no-store private auth;
  gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/json application/xml image/svg+xml;
  gzip_disable "MSIE [1-6]\.";

  # Racine du site
  root /usr/share/nginx/html;
  index index.html;

  # Gestion du routing SPA (Single Page Application)
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }

  # index.html est toujours revalidé : après un déploiement, le navigateur
  # doit récupérer la nouvelle version qui référence les nouveaux fichiers.
  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  # Mise en cache des assets statiques (noms hachés par Vite)
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2)$ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, no-transform";
  }

  # Gestion des erreurs
  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }
}
