# En-têtes de sécurité, inclus dans chaque `location` de nginx.conf : un
# `add_header` posé dans une location masque ceux du niveau `server`, il faut
# donc les répéter partout plutôt que les déclarer une seule fois.
#
# CSP : toute nouvelle origine externe (service tiers, CDN, police distante...)
# doit être ajoutée ici, sinon le navigateur la bloque. Les fichiers envoyés
# par les clients (PDF, images, STL) sont servis par l'API (*.lagrenaille.fr).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.lagrenaille.fr; font-src 'self' data:; connect-src 'self' blob: https://*.lagrenaille.fr; frame-src https://*.lagrenaille.fr blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
